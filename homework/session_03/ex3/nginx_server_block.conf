server {
    listen 80;
    server_name your_domain.com; # Thay bằng tên miền hoặc IP Droplet của bạn

    root /var/www/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cấu hình chặn thư mục /admin bằng HTTP Basic Auth
    location /admin {
        auth_basic "Restricted Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }
}
