# Cấu hình Nginx Virtual Hosts cho Beta App và Internal App

# Server block cho Beta App (Cổng 8080)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/beta-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Server block cho Internal App (Cổng 8090)
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /var/www/internal-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
